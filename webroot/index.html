<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>DeviceIdle Manager</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <div class="header-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L2 7l10 5 10-5-10-5z"/>
                        <path d="M2 17l10 5 10-5"/>
                        <path d="M2 12l10 5 10-5"/>
                    </svg>
                </div>
                <div class="header-text">
                    <h1>DeviceIdle Manager</h1>
                    <p class="subtitle">电池优化白名单管理</p>
                </div>
            </div>
            <div class="status-badge" id="status-badge">
                <span class="status-dot"></span>
                <span class="status-text">保护中</span>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Stats Card -->
            <div class="card stats-card">
                <div class="stat-item">
                    <span class="stat-value" id="app-count">0</span>
                    <span class="stat-label">已白名单</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-item">
                    <span class="stat-value" id="protect-status">✓</span>
                    <span class="stat-label">受保护</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-item">
                    <span class="stat-value" id="daemon-status">●</span>
                    <span class="stat-label">守护进程</span>
                </div>
            </div>

            <!-- Actions Card -->
            <div class="card actions-card">
                <h2 class="card-title">管理操作</h2>
                <div class="action-grid">
                    <button class="action-btn ripple" id="btn-add">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <path d="M12 8v8m-4-4h8"/>
                        </svg>
                        <span>添加应用</span>
                    </button>
                    <button class="action-btn ripple" id="btn-import">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                            <polyline points="17 8 12 3 7 8"/>
                            <line x1="12" y1="3" x2="12" y2="15"/>
                        </svg>
                        <span>导入列表</span>
                    </button>
                    <button class="action-btn ripple" id="btn-export">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        <span>导出列表</span>
                    </button>
                    <button class="action-btn ripple danger" id="btn-restore">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="1 4 1 10 7 10"/>
                            <path d="M3.51 15a9 9 0 11 2.13-9.36L1 10"/>
                        </svg>
                        <span>恢复原始</span>
                    </button>
                </div>
            </div>

            <!-- App List Card -->
            <div class="card list-card">
                <div class="list-header">
                    <h2 class="card-title">白名单应用</h2>
                    <div class="search-box">
                        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"/>
                            <path d="M21 21l-4.35-4.35"/>
                        </svg>
                        <input type="text" id="search-input" placeholder="搜索包名..." autocapitalize="off">
                        <button class="clear-search" id="clear-search">×</button>
                    </div>
                </div>
                <div class="app-list" id="app-list">
                    <div class="loading-state">
                        <div class="spinner"></div>
                        <p>加载中...</p>
                    </div>
                </div>
                <div class="empty-state" id="empty-state" style="display: none;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                        <path d="M9 12h6"/>
                    </svg>
                    <p>暂无白名单应用</p>
                    <p class="hint">点击上方"添加应用"按钮添加</p>
                </div>
            </div>

            <!-- Info Card -->
            <div class="card info-card">
                <h2 class="card-title">关于</h2>
                <div class="info-content">
                    <p>此模块接管 <code>/data/system/deviceidle.xml</code> 配置，防止系统或其他应用修改电池优化白名单。</p>
                    <p class="hint">首次安装时已自动备份原始配置。</p>
                </div>
            </div>
        </main>

        <!-- Add App Modal -->
        <div class="modal" id="modal-add">
            <div class="modal-overlay"></div>
            <div class="modal-content">
                <div class="modal-header">
                    <h3>添加应用到白名单</h3>
                    <button class="modal-close">×</button>
                </div>
                <div class="modal-body">
                    <div class="input-group">
                        <label>应用包名</label>
                        <input type="text" id="input-package" placeholder="例如: com.example.app" autocapitalize="off">
                        <p class="input-hint">输入要添加到电池优化白名单的应用包名</p>
                    </div>
                    <div class="input-group">
                        <label>批量添加（可选）</label>
                        <textarea id="input-batch" placeholder="每行一个包名..." rows="4"></textarea>
                        <p class="input-hint">留空则只添加上方单个包名</p>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary modal-close">取消</button>
                    <button class="btn btn-primary" id="btn-confirm-add">添加</button>
                </div>
            </div>
        </div>

        <!-- Import Modal -->
        <div class="modal" id="modal-import">
            <div class="modal-overlay"></div>
            <div class="modal-content">
                <div class="modal-header">
                    <h3>导入白名单</h3>
                    <button class="modal-close">×</button>
                </div>
                <div class="modal-body">
                    <div class="input-group">
                        <label>粘贴列表</label>
                        <textarea id="input-import" placeholder="每行一个包名，或粘贴XML内容..." rows="6"></textarea>
                    </div>
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="chk-replace">
                            <span class="checkbox-text">覆盖现有列表（不勾选则合并）</span>
                        </label>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary modal-close">取消</button>
                    <button class="btn btn-primary" id="btn-confirm-import">导入</button>
                </div>
            </div>
        </div>

        <!-- Export Modal -->
        <div class="modal" id="modal-export">
            <div class="modal-overlay"></div>
            <div class="modal-content">
                <div class="modal-header">
                    <h3>导出白名单</h3>
                    <button class="modal-close">×</button>
                </div>
                <div class="modal-body">
                    <div class="input-group">
                        <label>包名列表</label>
                        <textarea id="output-export" rows="6" readonly></textarea>
                    </div>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary modal-close">关闭</button>
                    <button class="btn btn-primary" id="btn-copy-export">复制</button>
                </div>
            </div>
        </div>

        <!-- Confirm Modal -->
        <div class="modal" id="modal-confirm">
            <div class="modal-overlay"></div>
            <div class="modal-content modal-small">
                <div class="modal-header">
                    <h3 id="confirm-title">确认操作</h3>
                </div>
                <div class="modal-body">
                    <p id="confirm-message">确定要执行此操作吗？</p>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-secondary modal-close">取消</button>
                    <button class="btn btn-danger" id="btn-confirm-action">确认</button>
                </div>
            </div>
        </div>

        <!-- Toast -->
        <div class="toast" id="toast">
            <span class="toast-icon" id="toast-icon">✓</span>
            <span class="toast-message" id="toast-message">操作成功</span>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
